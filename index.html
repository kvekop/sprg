<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Špargaklės // Nexus</title>
<style>
:root{--bg:#080a0f;--panel:#10141d;--panel2:#151a25;--text:#eef2ff;--muted:#8f9bb3;--accent:#7c5cff;--accent2:#00e5ff;--danger:#ff5577}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#1a1240 0,transparent 35%),radial-gradient(circle at 90% 20%,#00343d 0,transparent 30%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{height:72px;border-bottom:1px solid #202637;background:#0b0e15cc;backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 28px;justify-content:space-between;position:sticky;top:0;z-index:5}
.logo{font-weight:900;letter-spacing:1px}.logo span{color:var(--accent2)}
.wrap{max-width:1180px;margin:0 auto;padding:36px 22px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.eyebrow{color:var(--accent2);font-size:12px;font-weight:800;letter-spacing:2px}.hero h1{font-size:40px;margin:6px 0}.hero p{color:var(--muted);margin:0}.btn{border:1px solid #30384d;background:var(--panel2);color:var(--text);padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--accent);box-shadow:0 0 20px #7c5cff22}.btn.primary{background:linear-gradient(135deg,var(--accent),#5940db);border:0}.search{width:100%;background:#0d1119;border:1px solid #252d3f;color:white;padding:14px 16px;border-radius:12px;outline:none;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:linear-gradient(145deg,#121722,#0d1119);border:1px solid #242c3e;border-radius:16px;padding:20px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#7c5cff10,transparent 50%,#00e5ff08);pointer-events:none}.card:hover{transform:translateY(-3px);border-color:#6755cc;box-shadow:0 10px 35px #0008}.icon{font-size:28px;margin-bottom:16px}.card h3{margin:0 0 7px}.card p{color:var(--muted);margin:0}.count{display:inline-block;margin-top:16px;color:var(--accent2);font-size:12px;font-weight:800}.hidden{display:none!important}.back{margin-bottom:20px}.notes{display:grid;gap:12px}.note{background:var(--panel);border:1px solid #252d3f;border-radius:13px;padding:16px}.note h3{margin:0 0 8px}.note pre{white-space:pre-wrap;font:inherit;color:#dce3f5;margin:0}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed #30384d;border-radius:14px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.box{width:min(600px,100%);background:#111622;border:1px solid #30384d;border-radius:16px;padding:22px}.box input,.box textarea{width:100%;background:#0a0e15;border:1px solid #30384d;color:white;padding:12px;border-radius:9px;margin:8px 0 14px;font:inherit}.box textarea{min-height:150px;resize:vertical}.actions{display:flex;gap:10px;justify-content:flex-end}.status{font-size:12px;color:var(--muted)}
@media(max-width:650px){header{padding:0 16px}.wrap{padding:25px 16px}.hero{display:block}.hero h1{font-size:32px}.hero .btn{margin-top:18px}}
</style>
</head>
<body>
<header><div class="logo">SPARGA<span>KLĖS</span> // NEXUS</div><div class="status" id="status">LOCAL MODE</div></header>
<main class="wrap">
<section id="home">
<div class="hero"><div><div class="eyebrow">KNOWLEDGE LOADOUT</div><h1>Mano špargalkės</h1><p>Greitai rasi formules, taisykles ir užrašus.</p></div><button class="btn primary" onclick="openAdd()">+ Nauja špargalkė</button></div>
<input id="search" class="search" placeholder="🔎 Ieškoti špargalkės..." oninput="render()">
<div id="subjects" class="grid"></div>
</section>
<section id="subject" class="hidden">
<button class="btn back" onclick="goHome()">← Atgal</button>
<div class="hero"><div><div class="eyebrow" id="subjectEyebrow"></div><h1 id="subjectTitle"></h1></div><button class="btn primary" onclick="openAdd()">+ Pridėti</button></div>
<div id="notes" class="notes"></div>
</section>
</main>
<div id="modal" class="modal hidden">
<div class="box"><h2>Pridėti špargalkę</h2>
<label>Dalykas</label><input id="mSubject" placeholder="Pvz. Matematika">
<label>Pavadinimas</label><input id="mTitle" placeholder="Pvz. Laipsnių taisyklės">
<label>Turinys</label><textarea id="mText" placeholder="Įrašyk formules, taisykles ar kitą informaciją..."></textarea>
<div class="actions"><button class="btn" onclick="closeModal()">Atšaukti</button><button class="btn primary" onclick="saveNote()">Išsaugoti</button></div>
</div></div>
<script>
const key="spargakles_nexus_v1";
let notes=JSON.parse(localStorage.getItem(key)||"null")||[
{subject:"Matematika",title:"Laipsnių taisyklės",text:"aᵐ · aⁿ = aᵐ⁺ⁿ\\naᵐ : aⁿ = aᵐ⁻ⁿ\\n(aᵐ)ⁿ = aᵐⁿ"},
{subject:"Anglų",title:"Reported Speech",text:"Present → Past\\nwill → would\\ncan → could\\nPast → Past Perfect"},
{subject:"Lietuvių",title:"Barokas",text:"XVII a. baroko bruožai: kontrastai, laikinumo motyvas, religingumas, memento mori."}
];
let current=null;
const icons={Matematika:"∑",Anglų:"A",Lietuvių:"Ą",Chemija:"⚗",Fizika:"⚡",Istorija:"⌛",Geografija:"🌍"};

// Papildoma formulė matematikos skyriui
const formulaNote={
 subject:"Matematika",
 title:"📚 Formulės prieš kontrolinį",
 text:`MODULIS
|a| = a, kai a ≥ 0
|a| = -a, kai a < 0
|ab| = |a|·|b|
|a/b| = |a|/|b|
√(a²) = |a|
|x| = a → x = ±a, kai a > 0

LAIPSNIAI
aᵐ · aⁿ = aᵐ⁺ⁿ
aᵐ : aⁿ = aᵐ⁻ⁿ
(aᵐ)ⁿ = aᵐⁿ
(ab)ⁿ = aⁿbⁿ
(a/b)ⁿ = aⁿ/bⁿ
a⁰ = 1
a⁻ⁿ = 1/aⁿ

TRUPMENINIS LAIPSNIS
a^(m/n) = ⁿ√(aᵐ)
a^(1/n) = ⁿ√a
Vardiklis → šaknies laipsnis; skaitiklis → laipsnis po šaknimi.

ŠAKNYS
√[n](aᵐ) = a^(m/n)
√a · √b = √(ab)
√a / √b = √(a/b)
√72 = 6√2
∛40 = 2∛5

GREITOSIOS DAUGYBOS FORMULĖS
(a+b)² = a² + 2ab + b²
(a-b)² = a² - 2ab + b²
(a+b)(a-b) = a² - b²
a³+b³ = (a+b)(a²-ab+b²)
a³-b³ = (a-b)(a²+ab+b²)

IRACIONALUMO NAIKINIMAS VARDIKLYJE
1/√a → dauginame iš √a/√a
5/√3 = 5√3/3
1/(a+√b) → dauginame iš (a-√b)/(a-√b)
1/(a-√b) → dauginame iš (a+√b)/(a+√b)

SVARBIAUSIA
× → laipsnius sudedame
: → laipsnius atimame
(aᵐ)ⁿ → laipsnius dauginame
Skirtingi pagrindai → pirmiausia bandome juos suvesti į vienodą pagrindą.
√(x²) = |x|`
};
function persist(){localStorage.setItem(key,JSON.stringify(notes));}
if(!notes.some(n=>n.title==="📚 Formulės prieš kontrolinį")){
  notes.push(formulaNote);
  persist();
}
function subjects(){return [...new Set(notes.map(n=>n.subject))].sort()}
function render(){
 if(current){renderNotes();return}
 const q=document.getElementById("search").value.toLowerCase();
 const list=subjects().map(s=>({s,n:notes.filter(n=>n.subject===s&&((n.title+" "+n.text).toLowerCase().includes(q)))})).filter(x=>x.n.length||!q);
 document.getElementById("subjects").innerHTML=list.map(x=>`<div class="card" onclick="openSubject('${esc(x.s)}')"><div class="icon">${icons[x.s]||"◈"}</div><h3>${esc(x.s)}</h3><p>Atidaryti užrašus</p><span class="count">${x.n.length} špargakl${x.n.length===1?"ė":"ės"}</span></div>`).join("")||`<div class="empty">Nieko nerasta.</div>`;
}
function openSubject(s){current=s;document.getElementById("home").classList.add("hidden");document.getElementById("subject").classList.remove("hidden");document.getElementById("subjectEyebrow").textContent="SUBJECT LOADOUT";document.getElementById("subjectTitle").textContent=s;renderNotes()}
function renderNotes(){const q=(document.getElementById("search")?.value||"").toLowerCase();let arr=notes.filter(n=>n.subject===current&&((n.title+" "+n.text).toLowerCase().includes(q)));document.getElementById("notes").innerHTML=arr.map((n,i)=>`<article class="note"><h3>${esc(n.title)}</h3><pre>${esc(n.text)}</pre></article>`).join("")||`<div class="empty">Šiame dalyke dar nėra špargalkių.</div>`}
function goHome(){current=null;document.getElementById("subject").classList.add("hidden");document.getElementById("home").classList.remove("hidden");document.getElementById("search").value="";render()}
function openAdd(){document.getElementById("modal").classList.remove("hidden");document.getElementById("mSubject").value=current||"";document.getElementById("mTitle").value="";document.getElementById("mText").value=""}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function saveNote(){let s=document.getElementById("mSubject").value.trim(),t=document.getElementById("mTitle").value.trim(),x=document.getElementById("mText").value.trim();if(!s||!t||!x)return alert("Užpildyk visus laukus.");notes.push({subject:s,title:t,text:x});persist();closeModal();if(current){current=s;document.getElementById("subjectTitle").textContent=s;renderNotes()}else render()}
function esc(v){return v.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body>
</html>
